<style>
  #app, #app * { box-sizing: border-box; margin: 0; padding: 0; }
  #app {
    --azul: #1f6feb;
    --azul-esc: #0b3d91;
    --amarelo: #f5c518;
    --vermelho: #e63a2e;
    --verde: #2ea043;
    --tinta: #14202e;
    --papel: #f7f9fc;
    --cinza: #6b7789;
    --linha: #dfe6ef;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    color: var(--tinta);
    background:
      radial-gradient(circle at 12% 8%, rgba(245,197,24,.10), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(31,111,235,.10), transparent 42%),
      var(--papel);
    min-height: 100%;
    padding: 28px 18px 60px;
    line-height: 1.5;
  }
  #app .wrap { max-width: 640px; margin: 0 auto; }

  /* header */
  #app .brand { display:flex; align-items:center; gap:12px; margin-bottom: 6px; }
  #app .logo {
    width: 40px; height: 40px; border-radius: 50%; flex:none;
    box-shadow: 0 2px 8px rgba(11,61,145,.20);
    border: 2px solid #fff;
  }
  #app .brand b { font-size: 13px; letter-spacing:.5px; color: var(--cinza); font-weight:700; }
  #app h1 { font-size: 30px; line-height:1.1; margin: 10px 0 4px; color: var(--azul-esc); }
  #app .sub { color: var(--cinza); font-size: 15px; margin-bottom: 22px; }

  #app .prog-line { height: 8px; background: var(--linha); border-radius: 99px; overflow:hidden; margin-bottom: 26px; }
  #app .prog-fill { height:100%; background: linear-gradient(90deg, var(--amarelo), var(--azul)); width:0; transition: width .5s ease; }

  /* trilha de níveis */
  #app .trilha { display:flex; flex-direction:column; gap:14px; }
  #app .nivel {
    display:flex; align-items:center; gap:16px;
    background:#fff; border:1.5px solid var(--linha); border-radius:14px;
    padding:16px 18px; text-align:left; width:100%; cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s;
    font-family:inherit;
  }
  #app .nivel:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(11,61,145,.10); border-color: var(--azul); }
  #app .nivel:disabled { cursor:not-allowed; opacity:.55; background:#f0f3f8; }
  #app .badge {
    width:46px; height:46px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#fff;

  #app .nivel.locked .badge { background: var(--cinza); }
  #app .nivel .n-tit { font-size:16px; font-weight:700; }
  #app .nivel .n-sub { font-size:13px; color: var(--cinza); }
  #app .nivel .n-meta { margin-left:auto; font-size:12px; font-weight:700; color:var(--cinza); text-align:right; flex:none;}

  #app .card { background:#fff; border:1.5px solid var(--linha); border-radius:16px; padding:22px; }
  #app .lvl-tag { display:inline-block; background:var(--amarelo); color:var(--tinta); font-weight:800; font-size:12px; padding:4px 10px; border-radius:99px; margin-bottom:12px; }
  #app .qcount { color:var(--cinza); font-size:13px; font-weight:700; float:right; }
  #app .qtext { font-size:19px; font-weight:700; margin:6px 0 18px; }
  #app .opt {
    display:block; width:100%; text-align:left; font-family:inherit; font-size:15.5px;
    background:#fff; border:1.5px solid var(--linha); border-radius:11px;
    padding:13px 15px; margin-bottom:10px; cursor:pointer; transition: all .12s;

  #app .opt:hover:not(:disabled) { border-color:var(--azul); background:#f4f8ff; }
  #app .opt:disabled { cursor:default; }
  #app .opt.certa { border-color:var(--verde); background:#eaf7ee; font-weight:700; }
  #app .opt.errada { border-color:var(--vermelho); background:#fdeceb; }
  #app .fb { margin-top:6px; font-size:14.5px; padding:12px 14px; border-radius:10px; display:none; }
  #app .fb.ok { display:block; background:#eaf7ee; color:#12611f; }
  #app .fb.no { display:block; background:#fdeceb; color:#9e241b; }

  #app .of-painel h3 { font-size:15px; color:var(--cinza); margin-bottom:10px; }
  #app .of-in { display:flex; gap:8px; flex-wrap:wrap; }
  #app .of-in input { flex:1; min-width:130px; font-family:inherit; font-size:15px; padding:10px 12px; border:1.5px solid var(--linha); border-radius:10px; }
  #app .rk { list-style:none; margin-top:12px; }

  }

  #app .reset:active { transform: translateY(1px); }

// id anônimo do dispositivo: aleatório, guardado no navegador, não identifica a pessoa
function idDispositivo(){
  let d = null;
  try { d = localStorage.getItem("py_devid"); } catch(e){}
  if(!d){
    d = "d" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem("py_devid", d); } catch(e){}
  }
  return d;
}

// chamada ao Apps Script (contador + ranking da oficina)
async function apiOficina(params){
  if(!CONTADOR_URL) return null;
  const sep = CONTADOR_URL.indexOf("?") >= 0 ? "&" : "?";
  const q = Object.keys(params).map(k => k + "=" + encodeURIComponent(params[k])).join("&");
  try {
    const r = await fetch(CONTADOR_URL + sep + q, { redirect: "follow" });
    return await r.json();
  } catch(e){ return null; }
}

  const [nivelAtual, setNivelAtual] = useState(0);
  const [hits, setHits] = useState(null);
  const [carregou, setCarregou] = useState(false);
  const [acertosTotal, setAcertosTotal] = useState(0);
  const [oficina, setOficina] = useState(null);   // {cod, nome} enquanto inscrito
  const [ranking, setRanking] = useState([]);
  const [painel, setPainel] = useState(false);    // painel do ranking aberto?
  const [ofNome, setOfNome] = useState("");
  const [ofCod, setOfCod] = useState("");
  const [ofErro, setOfErro] = useState("");

  // carregar progresso (localStorage) + contar acesso (contador externo)
  useEffect(()=>{ (async()=>{
    try { const v = localStorage.getItem("py_progresso"); if(v) setProgresso(JSON.parse(v)); } catch(e){}
    try { const v = localStorage.getItem("py_acertos"); if(v) setAcertosTotal(JSON.parse(v)); } catch(e){}
    try { const v = localStorage.getItem("py_oficina"); if(v) setOficina(JSON.parse(v)); } catch(e){}
    // retomar um nível que ficou a meio (fechou a página, ecrã bloqueou, ligação caiu)
    try {
      const v = JSON.parse(localStorage.getItem("py_emcurso") || "null");
      if(v && typeof v.nv === "number" && v.nv >= 0 && v.nv < NIVEIS.length){
        setNivelAtual(v.nv);
        setTela("quiz");
      }
    } catch(e){}
    try {
      if (CONTADOR_URL) {
        const devId = idDispositivo();
        // contar no máximo 1x por dia por dispositivo
        const hoje = new Date().toISOString().slice(0,10); // AAAA-MM-DD
        const ultimo = localStorage.getItem("py_ultimo_dia");
        const sep = CONTADOR_URL.indexOf("?") >= 0 ? "&" : "?";
        const url = CONTADOR_URL + sep + "id=" + encodeURIComponent(devId);
        if (ultimo !== hoje) {
          // primeiro acesso do dia neste dispositivo: conta
          const r = await fetch(url, { redirect: "follow" });
          const d = await r.json();
          const n = (d && typeof d.value === "number") ? d.value : (typeof d === "number" ? d : null);
          if (n !== null) setHits(n);
          localStorage.setItem("py_ultimo_dia", hoje);
        } else {
          // já contado hoje: só lê o total sem somar (envia flag ping)
          try {
            const r = await fetch(url + "&ping=1", { redirect: "follow" });
            const d = await r.json();
            const n = (d && typeof d.value === "number") ? d.value : null;
            if (n !== null) setHits(n);
          } catch(e2){}
        }
      }
    } catch(e){}
    setCarregou(true);
  })(); }, []);

  async function salvarProgresso(nv){
    setProgresso(nv);
    try { localStorage.setItem("py_progresso", JSON.stringify(nv)); } catch(e){}
  }

  // ---- oficina: entrar, sair, pontuar, atualizar ----
  async function entrarOficina(){
    const nome = ofNome.trim(), cod = ofCod.trim().toUpperCase();
    if(!nome || !cod) return;
    setOfErro("");
    const d = await apiOficina({ acao:"entrar", cod, nome, id: idDispositivo() });
    if(d && d.erro === "codigo errado"){ setOfErro("Código errado — confirma com o monitor."); return; }
    if(!d || !d.ok){ setOfErro("Não deu para entrar. Verifica a ligação e tenta outra vez."); return; }
    if(d && d.ok){
      const of = { cod, nome };
      setOficina(of);
      try { localStorage.setItem("py_oficina", JSON.stringify(of)); } catch(e){}
      setRanking(d.ranking || []);
      enviarPontos(progresso, acertosTotal, of);
    }
  }

  function sairOficina(){
    setOficina(null); setRanking([]);
    try { localStorage.removeItem("py_oficina"); } catch(e){}
  }

  async function enviarPontos(niveis, acertos, of){
    const alvo = of || oficina;
    if(!alvo) return;
    const d = await apiOficina({ acao:"pontuar", cod: alvo.cod, id: idDispositivo(), niveis, acertos });
    if(d && d.ranking) setRanking(d.ranking);
  }

  // cada resposta certa conta na hora para o ranking
  function registarAcerto(){
    const novo = acertosTotal + 1;
    setAcertosTotal(novo);
    try { localStorage.setItem("py_acertos", JSON.stringify(novo)); } catch(e){}
    enviarPontos(progresso, novo);
  }

  async function atualizarRanking(){
    if(!oficina) return;
    const d = await apiOficina({ acao:"ranking", cod: oficina.cod });
    if(d && d.ranking) setRanking(d.ranking);
  }

  // enquanto o painel estiver aberto, atualiza sozinho de 20 em 20 segundos
  useEffect(()=>{
    if(!painel || !oficina) return;
    atualizarRanking();
    const t = setInterval(atualizarRanking, 20000);
    return ()=>clearInterval(t);
  }, [painel, oficina]);

  function abrir(i){ setNivelAtual(i); setTela("quiz"); }

  const pct = Math.round((progresso / NIVEIS.length) * 100);

      <h1>Trilha do Dado</h1>
      <div className="sub">Seis níveis, um por módulo. Acerte todas as perguntas para desbloquear o próximo.</div>
      <div className="prog-line"><div className="prog-fill" style={{width: pct+"%"}}></div></div>

      <div className="of-bar">
        <button className={"of-btn" + (painel?" on":"")} onClick={()=>setPainel(!painel)}>
          {oficina ? "Oficina · " + oficina.cod : "Oficina"}
        </button>
      </div>

      {painel && (
        <div className="of-painel">
          {!oficina ? (
            <>
              <h3>Entrar na oficina</h3>
              <div className="of-in">
                <input placeholder="Apelido" value={ofNome} onChange={e=>setOfNome(e.target.value)} />
                <input placeholder="Código" value={ofCod} onChange={e=>setOfCod(e.target.value)} style={{maxWidth:130}} />
                <button className="btn" onClick={entrarOficina}>Entrar</button>
              </div>
              {ofErro && <div className="of-nota" style={{color:"#c0392b", fontWeight:700}}>{ofErro}</div>}
              <div className="of-nota">O código é dito pelo monitor no início da oficina. O apelido aparece no ranking para toda a turma — não uses o nome completo.</div>
            </>
          ) : (
            <>
              <h3>Ranking da oficina {oficina.cod} — 6 melhores</h3>
              <ul className="rk">
                {ranking.length===0 && <div className="of-nota">Ainda sem pontuações. Conclui um nível para entrares no ranking.</div>}
                {ranking.map((x,i)=>(
                  <li key={i} className={x.nome===oficina.nome ? "eu" : ""}>
                    <span className="pos">{i+1}</span>
                    <span className="nm">{x.nome}</span>
                    <span className="pt">{x.niveis} níveis · {x.acertos} acertos</span>
                  </li>
                ))}
              </ul>
              <div className="of-nota">
                Atualização a cada 20s. Estás como <b>{oficina.nome}</b>.
                <button className="reset" style={{marginLeft:8}} onClick={sairOficina}>sair da oficina</button>
              </div>
            </>
          )}
        </div>
      )}

      {tela==="trilha" && (
        <TelaTrilha niveis={NIVEIS} progresso={progresso} onAbrir={abrir}
          onReset={async()=>{
            try { localStorage.removeItem("py_emcurso"); } catch(e){}
            await salvarProgresso(0);
          }} />
      )}
      {tela==="quiz" && (
        <Quiz nivel={NIVEIS[nivelAtual]} idx={nivelAtual}
          onSair={()=>setTela("trilha")}
          onAcerto={registarAcerto}
          onVenceu={async()=>{
            const nv = Math.max(progresso, nivelAtual+1);
            if(nivelAtual+1 > progresso) await salvarProgresso(nv);
            enviarPontos(nv, acertosTotal);
            setTela("trilha");
          }} />
      )}
    </div>
  );
}

function TelaTrilha({niveis, progresso, onAbrir, onReset}){

  return (
    <div>
      <div className="trilha">
        {niveis.map((nv,i)=>{
          const feito = i < progresso;
          const locked = i > progresso;
          const cls = "nivel " + (feito?"feito ":"") + (locked?"locked":"");
          return (
            <button key={i} className={cls} disabled={locked} onClick={()=>onAbrir(i)}>
              <div className="badge">{feito ? "✓" : (locked ? "🔒" : i+1)}</div>
              <div>
                <div className="n-tit">{nv.t}</div>
                <div className="n-sub">{nv.s} · {nv.perguntas.length} perguntas</div>
              </div>
              <div className="n-meta">{feito ? "Concluído" : (locked ? "Bloqueado" : "Jogar")}</div>
            </button>
          );
        })}
      </div>

      {progresso >= niveis.length && (
        <div className="card" style={{marginTop:18, textAlign:"center", borderColor:"var(--verde)"}}>
          <div style={{fontSize:38}}>🏆</div>
          <h2 style={{color:"var(--verde)"}}>Trilha completa!</h2>
          <p style={{color:"var(--cinza)"}}>Você passou pelos seis módulos. Mostre esta tela na oficina.</p>
        </div>
      )}

      <div className="foot">
        <div style={{marginTop:8}}><button className="reset" onClick={onReset}>reiniciar meu progresso</button></div>
      </div>
    </div>
  );
}

function Quiz({nivel, idx, onSair, onVenceu, onAcerto}){
  // se este nível ficou a meio, recomeça onde parou
  const guardado = (()=>{
    try {
      const v = JSON.parse(localStorage.getItem("py_emcurso") || "null");
      if(v && v.nv === idx && v.i > 0 && v.i < nivel.perguntas.length) return v;
    } catch(e){}
    return null;
  })();

  const [i, setI] = useState(guardado ? guardado.i : 0);
  const [escolha, setEscolha] = useState(null);
  const [acertos, setAcertos] = useState(guardado ? (guardado.acertos || 0) : 0);
  const [fim, setFim] = useState(false);

  function esquecerEmCurso(){ try { localStorage.removeItem("py_emcurso"); } catch(e){} }

  const p = nivel.perguntas[i];


  function responder(o){
    if(escolha!==null) return;
    setEscolha(o);
    if(o===p.c){
      setAcertos(a=>a+1);
      if(onAcerto) onAcerto();   // soma no ranking da oficina imediatamente
    }
  }
  function proxima(){
    if(i+1 < nivel.perguntas.length){
      setI(i+1); setEscolha(null);
      // guarda a posição JÁ com o resultado desta pergunta contado
      try { localStorage.setItem("py_emcurso", JSON.stringify({ nv: idx, i: i+1, acertos })); } catch(e){}
    } else {
      esquecerEmCurso();
      setFim(true);
    }
  }

  if(fim){
    const total = nivel.perguntas.length;
    const passou = acertos===total;
    return (
      <div className="card result">
        <div className="big">{passou ? "🎉" : "💪"}</div>
        <h2>{passou ? "Nível concluído!" : "Quase lá!"}</h2>
        <div className="stars">{"★".repeat(acertos)}{"☆".repeat(total-acertos)}</div>
        <p style={{color:"var(--cinza)", marginBottom:14}}>
          Você acertou <b>{acertos}</b> de <b>{total}</b>.
          {passou ? " O próximo nível está desbloqueado." : " Acerte todas para desbloquear o próximo nível."}
        </p>
        <div className="row" style={{justifyContent:"center"}}>
          {passou
            ? <button className="btn" onClick={()=>{esquecerEmCurso(); onVenceu();}}>Voltar à trilha ✓</button>
            : <>
                <button className="btn" onClick={()=>{esquecerEmCurso();setI(0);setEscolha(null);setAcertos(0);setFim(false);}}>Tentar de novo</button>
                <button className="btn ghost" onClick={()=>{esquecerEmCurso(); onSair();}}>Voltar</button>
              </>
          }
        </div>
      </div>
    );
  }

  return (
    <div className="card">
      <span className="lvl-tag">{nivel.s}</span>
      <span className="qcount">Pergunta {i+1}/{nivel.perguntas.length}</span>
      <div className="qtext">{p.q}</div>
      {p.o.map((op,k)=>{
        let cls="opt";
        if(escolha!==null){
          if(k===p.c) cls+=" certa";
          else if(k===escolha) cls+=" errada";
        }
        return <button key={k} className={cls} disabled={escolha!==null} onClick={()=>responder(k)}>{op}</button>;
      })}
      <div className={"fb " + (escolha===null?"":(escolha===p.c?"ok":"no"))}>
        {escolha!==null && (escolha===p.c ? "Certo! " : "Não é essa. ") + p.e}
      </div>
      {escolha!==null &&
        <button className="btn" onClick={proxima}>
          {i+1<nivel.perguntas.length ? "Próxima pergunta" : "Ver resultado"}
        </button>}
      {escolha===null && <button className="btn ghost" onClick={()=>{esquecerEmCurso(); onSair();}} style={{marginTop:14}}>Sair</button>}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("app"));
</script>
</body>
</html>
